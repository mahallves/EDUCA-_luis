<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educa+ | Login</title>

<style>
*{
    box-sizing: border-box;
}

body{
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f5ff, #f7fbff);
    display: flex;
    justify-content: center;
    align-items: center;
}

.caixa{
    width: 900px;
    min-height: 540px;
    background: white;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0, 70, 120, 0.15);
    display: flex;
    overflow: hidden;
}

.lado-esquerdo{
    width: 45%;
    background: linear-gradient(160deg, #1769aa, #0d8ac7);
    color: white;
    padding: 55px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
}

.lado-esquerdo h1{
    font-size: 48px;
    margin: 0 0 18px;
}

.lado-esquerdo h2{
    font-size: 23px;
    margin: 0 0 18px;
}

.lado-esquerdo p{
    font-size: 17px;
    line-height: 1.6;
    margin: 0;
}

.lado-direito{
    width: 55%;
    padding: 55px 65px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.lado-direito h2{
    margin: 0;
    color: #174a70;
    font-size: 30px;
}

.subtitulo{
    color: #777;
    margin: 10px 0 35px;
}

.campo{
    margin-bottom: 20px;
}

.campo label{
    display: block;
    margin-bottom: 8px;
    color: #174a70;
    font-weight: bold;
}

.campo input{
    width: 100%;
    padding: 15px;
    border: 2px solid #d8e8f2;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

.campo input:focus{
    border-color: #168ac5;
    box-shadow: 0 0 0 3px rgba(22, 138, 197, 0.12);
}

.botao{
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #1769aa;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.botao:hover{
    background: #0d8ac7;
    transform: translateY(-2px);
}

.aviso{
    display: none;
    margin-top: 25px;
    padding: 30px 20px;
    border-radius: 15px;
    background: #ffe1e1;
    border: 3px solid #e53935;
    color: #c62828;
    text-align: center;
    font-weight: bold;
    font-size: 25px;
    line-height: 1.5;
}

.aviso.mostrar{
    display: block;
}

@media(max-width: 750px){

    .caixa{
        width: 92%;
        flex-direction: column;
    }

    .lado-esquerdo,
    .lado-direito{
        width: 100%;
    }

    .lado-esquerdo{
        padding: 35px 25px;
    }

    .lado-direito{
        padding: 40px 30px;
    }
}
</style>
</head>

<body>

<div class="caixa">

    <div class="lado-esquerdo">

        <h1>Educa+</h1>

        <h2>Portal do Aluno</h2>

        <p>
            Acesse suas notas, atividades, frequência
            e materiais de estudo em um só lugar.
        </p>

    </div>

    <div class="lado-direito">

        <h2>Bem-vindo!</h2>

        <p class="subtitulo">
            Entre com seus dados para continuar.
        </p>

        <form id="formLogin">

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input 
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input 
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>

            <button class="botao" type="submit">
                Entrar
            </button>

            <div class="aviso" id="aviso">
                E-MAIL OU SENHA INCORRETOS!
                <br>
                Verifique seus dados e tente novamente.
            </div>

        </form>

    </div>

</div>

<script>
const formLogin = document.getElementById("formLogin");
const email = document.getElementById("email");
const senha = document.getElementById("senha");
const aviso = document.getElementById("aviso");

formLogin.addEventListener("submit", function(event){

    event.preventDefault();

    const emailCorreto = "m.maria07@escola.pr.gov.br";
    const senhaCorreta = "070709";

    if(email.value === emailCorreto && senha.value === senhaCorreta){

        window.location.href = "inicio.html";

    }else{

        aviso.classList.add("mostrar");
        senha.value = "";

    }

});
</script>

</body>
</html>
```
